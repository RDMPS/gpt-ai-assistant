<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>機票價格追蹤工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card h2 {
            color: #4a5568;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            min-width: 120px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #718096;
        }

        .btn-danger {
            background: #e53e3e;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            color: #667eea;
        }

        .results {
            margin-top: 30px;
        }

        .flight-item {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .flight-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .airline {
            font-weight: bold;
            color: #4a5568;
            font-size: 1.1em;
        }

        .price {
            font-size: 1.5em;
            font-weight: bold;
            color: #e53e3e;
        }

        .flight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: #4a5568;
        }

        .tracking-item {
            background: #f0fff4;
            border-left: 4px solid #38a169;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 0 10px 10px 0;
        }

        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .route-info {
            font-size: 1.1em;
            font-weight: bold;
            color: #2d3748;
        }

        .price-trend {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .price-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .price-current {
            background: #e6fffa;
            color: #319795;
        }

        .price-min {
            background: #f0fff4;
            color: #38a169;
        }

        .price-avg {
            background: #fffbeb;
            color: #d69e2e;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #f0fff4;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
        }

        .alert-info {
            background: #ebf8ff;
            color: #2b6cb0;
            border: 1px solid #90cdf4;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 30px;
        }

        .tab {
            padding: 15px 25px;
            background: none;
            border: none;
            color: #718096;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s, border-bottom-color 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .form-row, .form-row-3 {
                grid-template-columns: 1fr;
            }
            
            .flight-details {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .tracking-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ 機票價格追蹤工具</h1>
            <p>智能追蹤機票價格變化，幫您找到最佳購票時機</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">搜尋機票</button>
            <button class="tab" onclick="switchTab('tracking')">我的追蹤</button>
            <button class="tab" onclick="switchTab('analysis')">價格分析</button>
        </div>

        <!-- 搜尋機票 Tab -->
        <div id="search-tab" class="tab-content active">
            <div class="card">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M21,16V14L13,9V7A1,1 0 0,0 12,6A1,1 0 0,0 11,7V9L3,14V16L11,13.5V19L8,20.5V22L12,21L16,22V20.5L13,19V13.5L21,16Z" />
                    </svg>
                    搜尋機票
                </h2>
                
                <form id="search-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="origin">出發地</label>
                            <input type="text" id="origin" placeholder="例：TPE 桃園機場" required>
                        </div>
                        <div class="form-group">
                            <label for="destination">目的地</label>
                            <input type="text" id="destination" placeholder="例：NRT 成田機場" required>
                        </div>
                    </div>
                    
                    <div class="form-row-3">
                        <div class="form-group">
                            <label for="departure-date">出發日期</label>
                            <input type="date" id="departure-date" required>
                        </div>
                        <div class="form-group">
                            <label for="return-date">回程日期 (可選)</label>
                            <input type="date" id="return-date">
                        </div>
                        <div class="form-group">
                            <label for="passengers">乘客數</label>
                            <select id="passengers">
                                <option value="1">1人</option>
                                <option value="2">2人</option>
                                <option value="3">3人</option>
                                <option value="4">4人</option>
                                <option value="5">5人</option>
                            </select>
                        </div>
                    </div>
                    
                    <div style="display: flex; gap: 15px;">
                        <button type="submit" class="btn">搜尋機票</button>
                        <button type="button" class="btn btn-secondary" onclick="addTracking()">加入追蹤</button>
                    </div>
                </form>

                <div id="search-loading" class="loading">
                    <p>🔍 正在搜尋機票價格...</p>
                </div>

                <div id="search-results" class="results"></div>
            </div>
        </div>

        <!-- 我的追蹤 Tab -->
        <div id="tracking-tab" class="tab-content">
            <div class="card">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M12,2A7,7 0 0,1 19,9C19,14.25 12,22 12,22C12,22 5,14.25 5,9A7,7 0 0,1 12,2Z" />
                    </svg>
                    我的追蹤列表
                </h2>
                
                <div class="form-group">
                    <label for="user-id">用戶 ID</label>
                    <input type="text" id="user-id" placeholder="輸入您的用戶 ID">
                    <button type="button" class="btn" style="margin-top: 10px;" onclick="loadTrackings()">載入追蹤</button>
                </div>

                <div id="tracking-loading" class="loading">
                    <p>📋 正在載入您的追蹤列表...</p>
                </div>

                <div id="tracking-results" class="results"></div>
            </div>
        </div>

        <!-- 價格分析 Tab -->
        <div id="analysis-tab" class="tab-content">
            <div class="card">
                <h2>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M16,11.78L20.24,4.45L21.97,5.45L16.74,14.5L10.23,10.75L5.46,19H22V21H2V3H4V17.54L9.5,8L16,11.78Z" />
                    </svg>
                    價格分析
                </h2>
                
                <div class="form-group">
                    <label for="route-id">路線 ID</label>
                    <input type="text" id="route-id" placeholder="輸入要分析的路線 ID">
                    <button type="button" class="btn" style="margin-top: 10px;" onclick="loadAnalysis()">分析價格</button>
                </div>

                <div id="analysis-loading" class="loading">
                    <p>📊 正在分析價格趨勢...</p>
                </div>

                <div id="analysis-results" class="results"></div>
            </div>
        </div>
    </div>

    <script>
        // 設定今天為最早出發日期
        document.getElementById('departure-date').min = new Date().toISOString().split('T')[0];
        document.getElementById('return-date').min = new Date().toISOString().split('T')[0];

        // Tab 切換功能
        function switchTab(tabName) {
            // 隱藏所有 tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // 移除所有 tab 的 active 類別
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 顯示選定的 tab content
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // 添加 active 類別到選定的 tab
            event.target.classList.add('active');
        }

        // 搜尋機票
        document.getElementById('search-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                departureDate: document.getElementById('departure-date').value,
                returnDate: document.getElementById('return-date').value || null,
                passengers: parseInt(document.getElementById('passengers').value)
            };

            showLoading('search');
            
            try {
                const response = await fetch('/api/flights/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                hideLoading('search');

                if (result.success) {
                    displaySearchResults(result.data.flights);
                } else {
                    showAlert('search-results', result.error, 'error');
                }
            } catch (error) {
                hideLoading('search');
                showAlert('search-results', '搜尋時發生錯誤：' + error.message, 'error');
            }
        });

        // 顯示搜尋結果
        function displaySearchResults(flights) {
            const resultsDiv = document.getElementById('search-results');
            
            if (flights.length === 0) {
                resultsDiv.innerHTML = '<div class="alert alert-info">未找到符合條件的機票</div>';
                return;
            }

            let html = '<h3>搜尋結果 (' + flights.length + ' 個航班)</h3>';
            
            flights.forEach(flight => {
                html += `
                    <div class="flight-item">
                        <div class="flight-header">
                            <div class="airline">${flight.airline}</div>
                            <div class="price">$${flight.price} ${flight.currency}</div>
                        </div>
                        <div class="flight-details">
                            <div class="detail-item">
                                <div class="detail-label">飛行時間</div>
                                <div class="detail-value">${flight.flightTime}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">轉機次數</div>
                                <div class="detail-value">${flight.stops} 次</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">出發時間</div>
                                <div class="detail-value">${flight.departureTime}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">抵達時間</div>
                                <div class="detail-value">${flight.arrivalTime}</div>
                            </div>
                        </div>
                        <div style="margin-top: 15px; text-align: right;">
                            <a href="${flight.bookingUrl}" target="_blank" class="btn">前往訂票</a>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        // 加入追蹤
        async function addTracking() {
            const userId = prompt('請輸入您的用戶 ID：');
            if (!userId) return;

            const maxPrice = prompt('請輸入價格警報上限 (可選)：');
            
            const formData = {
                userId: userId,
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                departureDate: document.getElementById('departure-date').value,
                returnDate: document.getElementById('return-date').value || null,
                passengers: parseInt(document.getElementById('passengers').value),
                maxPrice: maxPrice ? parseFloat(maxPrice) : null
            };

            try {
                const response = await fetch('/api/flights/track', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (result.success) {
                    showAlert('search-results', '追蹤已成功添加！', 'success');
                } else {
                    showAlert('search-results', result.error, 'error');
                }
            } catch (error) {
                showAlert('search-results', '添加追蹤時發生錯誤：' + error.message, 'error');
            }
        }

        // 載入追蹤列表
        async function loadTrackings() {
            const userId = document.getElementById('user-id').value;
            if (!userId) {
                showAlert('tracking-results', '請輸入用戶 ID', 'error');
                return;
            }

            showLoading('tracking');
            
            try {
                const response = await fetch(`/api/flights/trackings/${userId}`);
                const result = await response.json();
                hideLoading('tracking');

                if (result.success) {
                    displayTrackings(result.data.trackings);
                } else {
                    showAlert('tracking-results', result.error, 'error');
                }
            } catch (error) {
                hideLoading('tracking');
                showAlert('tracking-results', '載入追蹤時發生錯誤：' + error.message, 'error');
            }
        }

        // 顯示追蹤列表
        function displayTrackings(trackings) {
            const resultsDiv = document.getElementById('tracking-results');
            
            if (trackings.length === 0) {
                resultsDiv.innerHTML = '<div class="alert alert-info">您還沒有任何追蹤項目</div>';
                return;
            }

            let html = '<h3>追蹤列表 (' + trackings.length + ' 項)</h3>';
            
            trackings.forEach(tracking => {
                const latestPrice = tracking.latestPrices[0];
                
                html += `
                    <div class="tracking-item">
                        <div class="tracking-header">
                            <div class="route-info">
                                ${tracking.route} | ${tracking.departureDate}
                                ${tracking.returnDate ? ' → ' + tracking.returnDate : ''}
                            </div>
                            <button class="btn btn-danger" onclick="removeTracking('${document.getElementById('user-id').value}', ${tracking.id})">
                                移除追蹤
                            </button>
                        </div>
                        
                        <div style="margin-bottom: 10px;">
                            <strong>乘客數：</strong> ${tracking.passengers} 人
                            ${tracking.maxPrice ? '<br><strong>價格上限：</strong> $' + tracking.maxPrice + ' TWD' : ''}
                        </div>
                        
                        ${latestPrice ? `
                            <div class="price-trend">
                                <div class="price-badge price-current">最新價格: $${latestPrice.price}</div>
                                <div class="price-badge">航空公司: ${latestPrice.airline}</div>
                                <div class="price-badge">更新時間: ${new Date(latestPrice.scraped_at).toLocaleString()}</div>
                            </div>
                        ` : '<div class="alert alert-info">暫無價格數據</div>'}
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        // 移除追蹤
        async function removeTracking(userId, subscriptionId) {
            if (!confirm('確定要移除這個追蹤嗎？')) return;
            
            try {
                const response = await fetch(`/api/flights/trackings/${userId}/${subscriptionId}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    showAlert('tracking-results', '追蹤已移除', 'success');
                    loadTrackings(); // 重新載入列表
                } else {
                    showAlert('tracking-results', result.error, 'error');
                }
            } catch (error) {
                showAlert('tracking-results', '移除追蹤時發生錯誤：' + error.message, 'error');
            }
        }

        // 載入價格分析
        async function loadAnalysis() {
            const routeId = document.getElementById('route-id').value;
            if (!routeId) {
                showAlert('analysis-results', '請輸入路線 ID', 'error');
                return;
            }

            showLoading('analysis');
            
            try {
                const response = await fetch(`/api/flights/analysis/${routeId}`);
                const result = await response.json();
                hideLoading('analysis');

                if (result.success) {
                    displayAnalysis(result.data);
                } else {
                    showAlert('analysis-results', result.error, 'error');
                }
            } catch (error) {
                hideLoading('analysis');
                showAlert('analysis-results', '載入分析時發生錯誤：' + error.message, 'error');
            }
        }

        // 顯示價格分析
        function displayAnalysis(analysis) {
            const resultsDiv = document.getElementById('analysis-results');
            
            if (analysis.message) {
                resultsDiv.innerHTML = `<div class="alert alert-info">${analysis.message}</div>`;
                return;
            }

            let html = `
                <h3>價格分析報告</h3>
                
                <div class="alert alert-info">
                    <strong>${analysis.recommendation}</strong>
                </div>
                
                <div class="price-trend">
                    <div class="price-badge price-current">目前價格: $${analysis.currentPrice}</div>
                    <div class="price-badge price-min">最低價格: $${analysis.minPrice}</div>
                    <div class="price-badge price-avg">平均價格: $${analysis.avgPrice}</div>
                    <div class="price-badge">最高價格: $${analysis.maxPrice}</div>
                </div>

                <h4 style="margin-top: 30px;">最近價格記錄</h4>
            `;
            
            analysis.latestPrices.forEach(price => {
                html += `
                    <div class="flight-item">
                        <div class="flight-header">
                            <div class="airline">${price.airline}</div>
                            <div class="price">$${price.price} ${price.currency}</div>
                        </div>
                        <div style="margin-top: 10px; color: #718096;">
                            記錄時間: ${new Date(price.scraped_at).toLocaleString()}
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        // 輔助函數
        function showLoading(section) {
            document.getElementById(section + '-loading').style.display = 'block';
        }

        function hideLoading(section) {
            document.getElementById(section + '-loading').style.display = 'none';
        }

        function showAlert(containerId, message, type) {
            const container = document.getElementById(containerId);
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            
            // 清除之前的警報
            container.querySelectorAll('.alert').forEach(alert => alert.remove());
            
            container.insertBefore(alertDiv, container.firstChild);
            
            // 3秒後自動移除警報
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
